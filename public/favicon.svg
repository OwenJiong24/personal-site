<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- OrangeKnows 图标：几何 monogram（正圆 O + 45° 折角 K）
       值取自 ui-toolkit tokens.css C 集（阳光橙 accent / 纸白 surface / 深炭灰 ink）；
       SVG 独立文件不支持 CSS 变量，故写死，改真源后同步：
       --accent oklch(.7 .185 52) ≈ #F26A1B；--surface ≈ #FFFEFB；--bg ≈ #FAF6EF -->
  <rect width="64" height="64" rx="14" fill="#211C18" />
  <g transform="translate(7.2 10) scale(0.78)">
    <circle cx="20" cy="28" r="16" stroke="#F26A1B" stroke-width="4.6" fill="none" />
    <path d="M40 8 V48 M40 28 L58 8 M40 28 L58 48" stroke="#FAF6EF" stroke-width="4.6" stroke-linecap="square" fill="none" />
  </g>
</svg>
